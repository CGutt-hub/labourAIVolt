name: LAV Labour-AI-Volt Analysis

# ─────────────────────────────────────────────────────────────────────────────
# Triggers
# ─────────────────────────────────────────────────────────────────────────────
on:
  # Automatic: every Monday at 06:00 UTC (fresh weekly data pull)
  schedule:
    - cron: '0 6 * * 1'

  # Manual: trigger from the Actions tab with optional parameter overrides
  workflow_dispatch:
    inputs:
      data_dir:
        description: 'Input data directory (relative to repo root)'
        required: false
        default: 'LAV_data'
      output_dir:
        description: 'Output directory (relative to repo root)'
        required: false
        default: 'LAV_results'

  # Automatic: re-run whenever country configs or analysis scripts change
  push:
    branches:
      - main
    paths:
      - 'LAV_data/**'
      - 'Python/**'

# ─────────────────────────────────────────────────────────────────────────────
# Permissions — needed so the action can commit results back to the repo
# ─────────────────────────────────────────────────────────────────────────────
permissions:
  contents: write

jobs:
  analyse:
    name: Run LAV Analysis Pipeline
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────────
      - name: Checkout labourAIVolt
        uses: actions/checkout@v4
        with:
          # Fetch full history so the result-commit step can push cleanly
          fetch-depth: 0

      # ── 2. Python environment ─────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: Python/requirements.txt

      - name: Install dependencies
        run: pip install -r Python/requirements.txt

      # ── 3. Run the LAV analysis pipeline ──────────────────────────────────
      #    lav_run.py orchestrates: api_reader → normalizing_processor →
      #    displacement_analyzer + trend_analyzer → volt_report_analyzer.
      #    No Nextflow or Java is required in CI; the output structure mirrors
      #    the Nextflow pipeline (LAV_results/LAV_l1/<id>/ + LAV_results/LAV_l2/).
      - name: Run LAV pipeline
        env:
          # Disable progress bars / colour codes that clutter CI logs
          PYTHONUNBUFFERED: '1'
        run: |
          python Python/lav_run.py \
            --data-dir   "${{ github.event.inputs.data_dir   || 'LAV_data' }}" \
            --output-dir "${{ github.event.inputs.output_dir || 'LAV_results' }}"

      # ── 4. Upload results as a downloadable artifact ──────────────────────
      - name: Upload LAV results
        uses: actions/upload-artifact@v4
        with:
          name: lav-results-${{ github.run_number }}
          # Upload the full LAV_results tree (l1 + l2) so analysts can inspect
          # every country's parquet files without cloning.
          path: LAV_results/
          # Keep artifacts for 90 days (adjust as needed)
          retention-days: 90
          # Don't fail the job if there are no results (e.g. all API calls failed)
          if-no-files-found: warn

      # ── 5. Commit results back to the repository ──────────────────────────
      #    The LAV_results/.gitignore allows parquet files when they live inside
      #    LAV_l1/ or LAV_l2/ subdirectories that are tracked.
      #    Only commits if there are actual changes (idempotent).
      - name: Commit and push results
        run: |
          git config user.name  "LAV Pipeline [bot]"
          git config user.email "lav-pipeline@automated.local"

          # Stage only the results directory
          git add LAV_results/

          # Commit only if there are staged changes
          if git diff --cached --quiet; then
            echo "No result changes to commit."
          else
            git commit -m \
              "autosync: LAV analysis results [run #${{ github.run_number }}]"
            git push
          fi
